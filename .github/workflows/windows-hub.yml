name: Hub Windows package

on:
  push:
    tags: ["hub-v*"]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build hub package
        shell: pwsh
        run: ./packaging/windows/build-hub.ps1 -Version "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pharmacore-hub-windows
          path: dist/PharmaCoreHub-*.zip
          retention-days: 30
